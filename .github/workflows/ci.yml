name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck, lint, build and verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # The build must succeed with no secrets present.
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify generation engine
        run: npx tsx scripts/verify-engine.ts

      - name: Verify end-to-end API flow
        run: npx tsx scripts/verify-flow.ts
